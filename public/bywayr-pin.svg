<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Terracotta Gradient -->
    <linearGradient id="pinBase" x1="256" y1="64" x2="256" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea5e4b"/>
      <stop offset="100%" stop-color="#c94432"/>
    </linearGradient>

    <!-- Modern Soft Gloss Highlight (Diffused) -->
    <linearGradient id="softGloss" x1="210" y1="70" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Base Shadow -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(28, 25, 23, 0.22)"/>
      <stop offset="100%" stop-color="rgba(28, 25, 23, 0)"/>
    </radialGradient>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="256" cy="460" rx="44" ry="10" fill="url(#dropShadow)"/>

  <!-- Main Pin Body -->
  <path d="M256 64C170.95 64 102 132.95 102 218C102 316.5 256 448 256 448C256 448 410 316.5 410 218C410 132.95 341.05 64 256 64Z" 
        fill="url(#pinBase)"/>

  <!-- Soft Diffused Top Highlight -->
  <path d="M256 68C174.5 68 108 134.5 108 216C108 265 142 322 188 370C158 310 148 245 158 185C168 125 208 80 256 68Z" 
        fill="url(#softGloss)"/>

  <!-- Center White Ring -->
  <circle cx="256" cy="208" r="62" fill="#ffffff"/>

  <!-- Inner Center Dot -->
  <circle cx="256" cy="208" r="20" fill="#e05a47"/>
</svg>
